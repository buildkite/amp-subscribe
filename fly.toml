app = "lox-amp-subscribe"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/relay.sqlite"
  AMP_OIDC_AUDIENCE = "urn:lox:amp-subscribe,urn:lox:amp-github-relay"
  AMP_WEBHOOK_ALLOWED_HOSTS = "ampcode.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[metrics]
  port = 9091
  path = "/metrics"

[[mounts]]
  source = "relay_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
